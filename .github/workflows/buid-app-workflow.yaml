name: Build
on: [pull_request, push]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Check locale strings
        run: python3 scripts/check_locale_strings.py
      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  build:
    # Gate the release build on the test job: without this the two jobs run in
    # parallel, so a red suite still published a `snapshot` pre-release. The unit
    # tests were unbuildable for three commits and every one of them shipped a
    # snapshot anyway.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: 17
          cache: gradle
      - name: Decode production keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.KEYSTORE }}" | tr -d '[:space:]' | base64 -di > "$RUNNER_TEMP/android_keystore.keystore"
      - name: Build Mihomo debug preview
        if: github.ref == 'refs/heads/feat/mihomo-browser'
        run: ./gradlew assembleDebug -PuniversalApk
      - name: Build unsigned feature artifacts
        if: github.ref != 'refs/heads/main'
        run: ./gradlew assembleRelease assembleReleaseAlt -PuniversalApk
      - name: Build unsigned feature bundle
        if: github.ref != 'refs/heads/main'
        run: ./gradlew bundleRelease
      - name: Build signed production artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew assembleRelease assembleReleaseAlt -PuniversalApk -Pandroid.injected.signing.store.file=$RUNNER_TEMP/android_keystore.keystore -Pandroid.injected.signing.store.password=${{ secrets.PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.PASSWORD }}
      - name: Build signed production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew bundleRelease -Pandroid.injected.signing.store.file=$RUNNER_TEMP/android_keystore.keystore -Pandroid.injected.signing.store.password=${{ secrets.PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.PASSWORD }}
      - name: Verify Mihomo frontend bundle
        if: github.ref == 'refs/heads/feat/mihomo-browser'
        run: |
          test -s app/build/generated/zashboard-assets/index.html
          find app/build/generated/zashboard-assets -type f -name '*.js' -print -quit | grep -q .
          find app/build/generated/zashboard-assets -type f -name '*.css' -print -quit | grep -q .

          for abi in armeabi-v7a arm64-v8a x86_64; do
            find app/build/outputs/apk/debug -type f -name "*${abi}*.apk" -print -quit | grep -q .
            find app/build/outputs/apk/release -type f -name "*${abi}*.apk" -print -quit | grep -q .
          done

          find app/build/outputs/apk/debug -type f -name '*universal*.apk' -print -quit | grep -q .
          find app/build/outputs/apk/release -type f -name '*universal*.apk' -print -quit | grep -q .
          test -s app/build/outputs/bundle/release/app-release.aab

          if find app/build/outputs/apk -type f -name '*-x86-*.apk' -print -quit | grep -q .; then
            echo "Unexpected unsupported x86 APK was produced" >&2
            exit 1
          fi
      - name: Generate artifact checksums
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > app/build/outputs/SHA256SUMS
          if [ -d app/build/outputs/apk/debug ]; then
            find app/build/outputs/apk/debug -type f -name '*.apk' -print0 \
              | sort -z \
              | xargs -0 sha256sum > app/build/outputs/DEBUG_SHA256SUMS
          fi
          cat app/build/outputs/SHA256SUMS
      - name: Upload feature build artifacts
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mihomo-browser-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/releaseAlt/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS
            app/build/outputs/DEBUG_SHA256SUMS
      - name: Publish Mihomo debug preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/mihomo-browser'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_VERSION="$(sed -n 's/.*versionName = "\\(.*\\)"/\\1/p' app/build.gradle.kts | head -1)"
          gh release delete mihomo-debug-preview --yes --cleanup-tag || true
          gh release create mihomo-debug-preview \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "EinkBro Mihomo ${APP_VERSION} (${GITHUB_SHA:0:7})" \
            --notes "Automated pre-release build of EinkBro Mihomo ${APP_VERSION} from feat/mihomo-browser. Tests, lint, unsigned release artifacts, and frontend bundle verification run before publication." \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/DEBUG_SHA256SUMS
      - name: Publish snapshot pre-release
        # Rolling pre-release replacing the old CI-artifact "snapshot" downloads:
        # each commit on main recreates the `snapshot` tag/release so the
        # Releases page always offers one up-to-date pre-release build.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --yes --cleanup-tag || true
          gh release create snapshot \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot (${GITHUB_SHA:0:7})" \
            --notes "Automated pre-release build of commit ${GITHUB_SHA}. Built from main on every commit; may be unstable." \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk \
            app/build/outputs/apk/release/app-universal-release.apk \
            app/build/outputs/apk/releaseAlt/app-universal-releaseAlt.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/SHA256SUMS